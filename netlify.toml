[build]
  # A broken internal link, missing asset or leaked file fails the deploy.
  # Third-party links are checked in CI only, so an outage elsewhere cannot block a deploy.
  command = "bun install && bun run build:site && bun run qa:site:offline"
  publish = "dist-site"

# Redirects for directory indexes
[[redirects]]
  from = "/docs/"
  to = "/docs/index.html"
  status = 200

[[redirects]]
  from = "/examples/"
  to = "/examples/index.html"
  status = 200

# One canonical host: the netlify.app address redirects to the custom domain.
[[redirects]]
  from = "https://amphibious-aiab.netlify.app/*"
  to = "https://amphibious.aiab.app/:splat"
  status = 301
  force = true

# The cart page moved to examples/_archive and was replaced by the e-commerce cart.
[[redirects]]
  from = "/examples/shopping-cart-modern.html"
  to = "/examples/e-commerce-cart"
  status = 301

[[redirects]]
  from = "/examples/shopping-cart-modern"
  to = "/examples/e-commerce-cart"
  status = 301

# The old icon docs page was a meta-refresh stub; a real redirect replaces it.
[[redirects]]
  from = "/docs/components/icons.html"
  to = "/docs/icons"
  status = 301

[[redirects]]
  from = "/docs/components/icons"
  to = "/docs/icons"
  status = 301

# Only redirect actual 404s to home page, not all pages!
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers on every response. A Content-Security-Policy is deliberately not
# set yet: the docs rely on inline scripts and styles, so it needs hashes or a
# report-only rollout first. microphone stays allowed for same-origin voice search demos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), microphone=(self)"

# Headers for MIME types and caching
[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=UTF-8"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=UTF-8"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"
