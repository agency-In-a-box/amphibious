name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run TypeScript check
        run: bun run typecheck

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test test/components.test.ts test/modal.test.ts test/tooltip.test.ts test/forms.test.ts test/carousel.test.ts test/tabs.test.ts test/theme-cascade.test.ts test/smooth-scroll.test.ts test/navigation.test.ts test/cascade.test.ts test/accordion.test.ts test/dropdown.test.ts test/toast.test.ts test/datepicker.test.ts test/data-table.test.ts test/range-slider.test.ts test/search-bar.test.ts test/file-upload.test.ts test/a11y.test.ts test/code-splitting.test.ts --preload ./test/setup.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Validate library artifacts
        run: |
          echo "Checking main bundle output..."
          MISSING=0
          for f in dist/amphibious.es.js dist/amphibious.umd.js dist/amphibious.css; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              MISSING=1
            else
              echo "✅ Found: $f ($(wc -c < "$f") bytes)"
            fi
          done
          echo ""
          echo "Checking per-component ESM output..."
          for f in dist/esm/carousel.js dist/esm/modal.js dist/esm/form-builder.js dist/esm/loaders.js dist/esm/sanitize.js; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing ESM chunk: $f"
              MISSING=1
            else
              echo "✅ Found: $f ($(wc -c < "$f") bytes)"
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo "Library build failed — expected artifacts missing"
            exit 1
          fi

      - name: Check bundle size
        run: |
          echo "Library bundle sizes:"
          ls -lh dist/amphibious.es.js dist/amphibious.umd.js dist/amphibious.css

          # Fail if combined library size exceeds 2MB
          SIZE=$(cat dist/amphibious.es.js dist/amphibious.umd.js dist/amphibious.css | wc -c)
          if [ $SIZE -gt 2097152 ]; then
            echo "❌ Combined library size exceeds 2MB limit!"
            exit 1
          else
            echo "✅ Library size is within limits ($SIZE bytes)"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run dependency audit
        run: |
          # Generate temporary lockfile for npm audit (project uses bun)
          npm install --package-lock-only --ignore-scripts 2>/dev/null
          npm audit --audit-level=high || echo "::warning::Audit found vulnerabilities"
          rm -f package-lock.json

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build documentation site
        run: bun run build:site

      - name: Deploy to Netlify Preview
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './dist-docs'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5