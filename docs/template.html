<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    /* Apply the saved theme before first paint (key/values match DarkModeToggle). */
    try { var t = localStorage.getItem('amphibious-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); else if (t === 'system') document.documentElement.removeAttribute('data-theme'); } catch (e) {}
  </script>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Template — Amphibious 2.0</title>
  <meta name="description" content="Starter templates and layout patterns for building pages with the Amphibious 2.0 framework.">
  <script type="module">
    import '/src/index.ts';
    import '/src/css/pages.css';
    import './template.css';
  </script>
  <!-- CSS loaded via JavaScript module -->
</head>
<body>
  <!-- Skip Navigation -->
  <a href="#main-content" class="aiab-skip-link">Skip to main content</a>

  <!-- Navigation Include -->

  <!-- Document Header -->
  <header class="aiab-doc-header">
    <div class="aiab-container">
      <div class="aiab-row">
        <div class="aiab-col-16">
          <nav aria-label="Breadcrumb">
            <ol class="aiab-breadcrumb">
              <li><a href="/">Home</a></li>
              <li><a href="./">Documentation</a></li>
              <li aria-current="page">PAGE_TITLE</li>
            </ol>
          </nav>
          <h1>PAGE_TITLE</h1>
          <p class="lead">PAGE_LEAD</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="doc-content">
    <div class="aiab-container">
      <div class="aiab-row">
        <!-- Sidebar Navigation -->
        <aside class="aiab-col-4">
          <nav class="doc-sidebar" aria-label="Page navigation">
            <h3>On This Page</h3>
            <ul>
              <!-- PAGE_NAV_ITEMS -->
            </ul>
          </nav>
        </aside>

        <!-- Main Content Area -->
        <article class="aiab-col-12">
          <!-- CONTENT_SECTIONS -->
        </article>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="aiab-container">
      <div class="aiab-row">
        <div class="aiab-col-16">
          <p>&copy; 2024 Amphibious 2.0. Built with modern CSS and semantic HTML.</p>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // Highlight active section in aiab-sidebar
    const sections = document.querySelectorAll('.doc-section');
    const navLinks = document.querySelectorAll('.doc-sidebar a');

    window.addEventListener('scroll', () => {
      let current = '';
      sections.forEach(section => {
        const sectionTop = section.offsetTop;
        const _sectionHeight = section.clientHeight;
        if (scrollY >= sectionTop - 150) {
          current = section.getAttribute('id');
        }
      });

      navLinks.forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('href').includes(current)) {
          link.classList.add('active');
        }
      });
    });
  </script>

</body>
</html>
